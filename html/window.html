<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window and Tabs</title>
    <script>
        function openGoogle() {
            window.open("https://www.google.com", "_blank");
        }
    </script>
</head>

<body>
    <h2>Understanding Window and Tabs</h2>

    <button onclick="openGoogle()">Open New Tab</button>
</body>

</html>
